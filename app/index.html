<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Mentionloom</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/app/components/orbit/runtime/assets/OpenRunde-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/app/components/orbit/runtime/tokens.css" />
    <link rel="stylesheet" href="/app/components/orbit/runtime/styles.css" />
    <link rel="stylesheet" href="/app/components/orbit/runtime/motion.css" />
    <link rel="stylesheet" href="/app/components/orbit/runtime/numbers.css" />
    <link rel="stylesheet" href="/app/components/orbit/runtime/controls.css" />
    <link rel="stylesheet" href="/app/components/orbit/runtime/starter.css" />
    <link rel="stylesheet" href="/app/components/orbit/runtime/extras.css" />
    <link rel="stylesheet" href="/app/tokens.css" />
    <link rel="stylesheet" href="/app/app.css" />
    <link rel="stylesheet" href="/app/foundation.css" />
    <link rel="stylesheet" href="/app/launch-entry.css" />
    <script type="module" src="/app/product.js"></script>
  </head>
  <body class="discovery-app launch-product">
    <a class="skip-link" href="#launch-main">Skip to content</a>
    <header class="app-header launch-header">
      <div class="header-inner">
        <a class="launch-brand" href="/app/overview/" aria-label="Mentionloom overview">
          <img src="/assets/ml-dark.svg" width="31" height="31" alt="" />
          <span>Mentionloom</span>
        </a>
        <div class="launch-workspace" id="workspace-name" hidden></div>
        <div class="header-spacer"></div>
        <nav class="launch-nav" id="launch-nav" aria-label="Workspace pages" hidden>
          <a href="/app/overview/" data-product-route="overview">Overview</a>
          <a href="/app/questions/" data-product-route="questions">Questions</a>
          <a href="/app/opportunities/" data-product-route="opportunities">Opportunities</a>
        </nav>
        <button class="button ghost launch-signout" id="sign-out" type="button" hidden>Sign out</button>
      </div>
    </header>
    <main id="launch-main" class="launch-main" tabindex="-1" aria-live="polite" aria-busy="true">
      <div class="launch-loading"><span class="launch-spinner" aria-hidden="true"></span><span>Loading your workspace…</span></div>
    </main>
    <footer class="launch-footer"><span>Clear signals for better AI discovery.</span><a href="/privacy/">Privacy</a></footer>
    <div class="launch-toast" id="launch-toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
